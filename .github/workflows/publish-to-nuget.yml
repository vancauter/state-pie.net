name: Publish to NuGet

on:
    workflow_dispatch:
        inputs:
            version:
                description: "New NuGet version to publish, for example 1.2.3 or 1.2.3-rc.1"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: publish-to-nuget
    cancel-in-progress: false

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Test solution
              run: dotnet test StatePie.sln --configuration Release

            - name: Pack library
              env:
                  PACKAGE_VERSION: ${{ inputs.version }}
              run: dotnet pack src/StatePie.csproj --configuration Release --output ./artifacts -p:PackageVersion="$PACKAGE_VERSION"

            - name: Authenticate to NuGet with OIDC
              id: nuget-login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Push package
              env:
                  NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
