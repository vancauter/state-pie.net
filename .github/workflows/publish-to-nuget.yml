name: Publish to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-to-nuget
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          project_version="$(dotnet msbuild src/StatePie.csproj -t:GetBuildVersion -getProperty:NuGetPackageVersion)"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match project version $project_version"
            exit 1
          fi

      - name: Test solution
        run: dotnet test StatePie.sln --configuration Release

  publish:
    needs: validate-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Pack library
        run: dotnet pack src/StatePie.csproj --configuration Release --output ./artifacts

      - name: Authenticate to NuGet with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
