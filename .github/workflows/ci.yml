name: CI

on:
    push:
        branches:
            - develop
            - "release/**"
    pull_request:
        branches:
            - main
            - "release/**"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore StatePie.sln

            - name: Check formatting
              run: dotnet format whitespace StatePie.sln --verify-no-changes --no-restore

            - name: Lint
              run: dotnet format style StatePie.sln --verify-no-changes --no-restore --severity warn

            - name: Build solution
              run: dotnet build StatePie.sln --configuration Release --no-restore

            - name: Run tests
              run: dotnet test tests/StatePie.Tests.csproj --configuration Release --no-build

            - name: Verify package can be packed
              run: dotnet pack src/StatePie.csproj --configuration Release --no-build --no-restore --output ./artifacts
