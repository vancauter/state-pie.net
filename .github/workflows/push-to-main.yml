name: Push Develop to Main

on:
    push:
        branches: [develop]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Test solution
              run: dotnet test StatePie.sln --configuration Release

    sync:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure Git User
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Merge and Filter
              run: |
                  git checkout main
                  git merge develop --no-ff --no-commit

                  # Remove files/directories you never want on main
                  git rm -rf --ignore-unmatch .vscode/
                  git rm -rf --ignore-unmatch .github/agents/
                  git rm -f --ignore-unmatch *.code-workspace
                  git rm -f --ignore-unmatch .editorconfig
                  git rm -f --ignore-unmatch .prettier*
                  git rm -f --ignore-unmatch ROADMAP.md

                  # Commit and push if there are changes
                  git commit -m "chore: develop to main (filtered)" || echo "No changes to sync"
                  git push origin main
